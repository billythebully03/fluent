<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Fluent — практика английского</title>

  <style>
    :root {
      color-scheme: light;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --footer-bg: #f5f5f7;
      --blue: #0071e3;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: clip;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: clip;
      background: #fff;
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    .header-layout {
      width: min(1160px, calc(100% - 72px));
      margin: 0 auto;
      padding: 38px 0 48px;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) 650px;
      column-gap: 38px;
      align-items: start;
    }

    .brand-area {
      max-width: 440px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo {
      display: block;
      width: auto;
      height: 46px;
      object-fit: contain;
    }

    .tagline {
      max-width: 415px;
      margin: 19px 0 0;
      color: #515156;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.015em;
    }

    .main-nav {
      width: 650px;
      max-width: 100%;
      justify-self: end;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      column-gap: 18px;
      row-gap: 24px;
    }

    .menu-column {
      min-width: 0;
    }

    .menu-title {
      margin: 0 0 11px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    .menu-links {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-links a {
      color: var(--secondary);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .menu-links a:hover {
      color: var(--text);
    }

    .menu-links .social-link::before {
      content: "↗";
      display: inline-block;
      margin-right: 6px;
      color: #8e8e93;
      font-size: 11px;
      transform: translateY(-1px);
    }

    .award-note {
      margin: 0;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
    }

    .award-note a {
      text-decoration: underline;
      text-decoration-color: #8e8e93;
      text-underline-offset: 3px;
    }

    .ticker-section {
      width: 100%;
      margin: 0;
    }

    .ticker-viewport {
      position: relative;
      display: flex;
      width: 100%;
      height: 108px;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(
        90deg,
        #fff 0%,
        var(--footer-bg) 17%,
        var(--footer-bg) 83%,
        #fff 100%
      );
      cursor: grab;
      touch-action: pan-y;
      overscroll-behavior-x: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .ticker-viewport.is-dragging {
      cursor: grabbing;
    }

    .ticker-viewport:focus-visible {
      outline: 2px solid rgb(0 113 227 / 35%);
      outline-offset: -4px;
    }

    .ticker-track {
      position: relative;
      z-index: 1;
      display: flex;
      width: max-content;
      min-width: 100%;
      flex: 0 0 auto;
      align-items: center;
      animation-name: ticker-scroll;
      animation-duration: var(--ticker-duration, 70s);
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-play-state: running;
      will-change: transform;
    }

    .ticker-viewport:hover .ticker-track {
      animation-play-state: paused;
    }

    .ticker-copy {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 64px;
      padding-right: 64px;
      color: #3f3f44;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .ticker-copy span {
      flex: 0 0 auto;
    }

    .ticker-blur {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      background: rgb(255 255 255 / 1%);
      pointer-events: none;
    }

    .ticker-blur--soft {
      width: 220px;
      -webkit-backdrop-filter: blur(1px);
      backdrop-filter: blur(1px);
    }

    .ticker-blur--medium {
      width: 145px;
      -webkit-backdrop-filter: blur(2.8px);
      backdrop-filter: blur(2.8px);
    }

    .ticker-blur--strong {
      width: 78px;
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
    }

    .ticker-blur--left {
      left: 0;
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 28%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 0%, #000 28%, transparent 100%);
    }

    .ticker-blur--right {
      right: 0;
      -webkit-mask-image: linear-gradient(270deg, #000 0%, #000 28%, transparent 100%);
      mask-image: linear-gradient(270deg, #000 0%, #000 28%, transparent 100%);
    }

    .ticker-edge {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      width: 170px;
      pointer-events: none;
    }

    .ticker-edge--left {
      left: 0;
      background: linear-gradient(
        90deg,
        #fff 0%,
        rgb(255 255 255 / 82%) 28%,
        rgb(255 255 255 / 0%) 100%
      );
    }

    .ticker-edge--right {
      right: 0;
      background: linear-gradient(
        270deg,
        #fff 0%,
        rgb(255 255 255 / 82%) 28%,
        rgb(255 255 255 / 0%) 100%
      );
    }

    @keyframes ticker-scroll {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(-50%, 0, 0);
      }
    }

    .footer-art-wrap {
      position: relative;
      width: min(1100px, calc(100% - 64px));
      margin: 58px auto 0;
      line-height: 0;
    }

    .footer-art {
      display: block;
      width: 100%;
      height: auto;
    }

    .back-to-top {
      position: absolute;
      right: clamp(14px, 2.5vw, 30px);
      bottom: clamp(12px, 2.5vw, 26px);
      z-index: 2;
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      gap: 8px;
      padding: 11px 15px;
      border: 0;
      border-radius: 999px;
      outline: none;
      background: rgb(255 255 255 / 48%);
      color: #3a3a3c;
      font: 500 13px/1 var(--font);
      white-space: nowrap;
      cursor: pointer;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      transition: background-color 180ms ease, transform 180ms ease;
    }

    .back-to-top:hover {
      background: rgb(255 255 255 / 66%);
      transform: translateY(-1px);
    }

    .back-to-top:focus-visible {
      background: rgb(255 255 255 / 72%);
    }

    .back-to-top svg {
      display: block;
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .back-to-top svg path {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .site-footer {
      width: 100%;
      margin: 0;
      padding: 42px 0 48px;
      background: var(--footer-bg);
    }

    .footer-inner {
      width: min(1100px, calc(100% - 64px));
      margin: 0 auto;
    }

    .footer-copy p {
      margin: 0 0 17px;
      color: #5c5c61;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.72;
      letter-spacing: -0.005em;
    }

    .footer-copy p:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 1080px) {
      .header-layout {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 34px;
      }

      .main-nav {
        width: 100%;
        justify-self: stretch;
      }
    }

    @media (max-width: 680px) {
      .header-layout {
        width: calc(100% - 40px);
        padding: 28px 0 34px;
        row-gap: 30px;
      }

      .brand-logo {
        height: 44px;
      }

      .tagline {
        margin-top: 16px;
        font-size: 16px;
      }

      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 20px;
        row-gap: 24px;
      }

      .ticker-viewport {
        height: 96px;
      }

      .ticker-copy {
        gap: 46px;
        padding-right: 46px;
        font-size: 15px;
      }

      .ticker-blur--soft {
        width: 160px;
      }

      .ticker-blur--medium {
        width: 105px;
      }

      .ticker-blur--strong {
        width: 58px;
      }

      .ticker-edge {
        width: 130px;
      }

      .footer-art-wrap,
      .footer-inner {
        width: calc(100% - 40px);
      }

      .footer-art-wrap {
        margin-top: 42px;
      }

      .back-to-top {
        right: 10px;
        bottom: 10px;
        min-height: 38px;
        padding: 10px 12px;
        font-size: 12px;
      }

      .site-footer {
        padding: 32px 0 36px;
      }

      .footer-copy p {
        margin-bottom: 15px;
        font-size: 14px;
        line-height: 1.7;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .ticker-track {
        animation-play-state: paused !important;
      }

      .back-to-top {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <header class="site-header" id="top">
    <div class="header-layout">
      <div class="brand-area">
        <a class="brand-link" href="#top" aria-label="Fluent — на главную">
          <img
            class="brand-logo"
            src="./public/fluent.png"
            alt="Fluent"
            draggable="false"
          >
        </a>

        <p class="tagline">
          Английский не такой сложный. Зачем зубрить, если можно практиковаться и становиться увереннее?
        </p>
      </div>

      <nav class="main-nav" aria-label="Основная навигация">
        <div class="menu-grid" id="menuGrid"></div>
      </nav>
    </div>
  </header>

  <main>
    <section class="ticker-section" aria-label="Английский текст для чтения">
      <div
        class="ticker-viewport"
        id="tickerViewport"
        tabindex="0"
        role="region"
        aria-label="Бегущая строка с короткой историей на английском. Её можно прокручивать мышью, тачпадом или клавиатурой."
      >
        <div class="ticker-track" id="tickerTrack">
          <div class="ticker-copy" id="tickerCopy"></div>
          <div class="ticker-copy" id="tickerCopyDuplicate" aria-hidden="true"></div>
        </div>

        <div class="ticker-blur ticker-blur--soft ticker-blur--left" aria-hidden="true"></div>
        <div class="ticker-blur ticker-blur--medium ticker-blur--left" aria-hidden="true"></div>
        <div class="ticker-blur ticker-blur--strong ticker-blur--left" aria-hidden="true"></div>

        <div class="ticker-blur ticker-blur--soft ticker-blur--right" aria-hidden="true"></div>
        <div class="ticker-blur ticker-blur--medium ticker-blur--right" aria-hidden="true"></div>
        <div class="ticker-blur ticker-blur--strong ticker-blur--right" aria-hidden="true"></div>

        <div class="ticker-edge ticker-edge--left" aria-hidden="true"></div>
        <div class="ticker-edge ticker-edge--right" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <div class="footer-art-wrap">
    <img
      class="footer-art"
      src="./public/footer.png?v=8"
      alt=""
      draggable="false"
    >

    <button class="back-to-top" id="backToTop" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path>
      </svg>
      <span>Вернуть наверх</span>
    </button>
  </div>

  <footer class="site-footer" aria-label="О Fluent">
    <div class="footer-inner footer-copy" id="footerContent"></div>
  </footer>

  <script>
    const menuColumns = [
      {
        title: "Практика",
        items: [
          { label: "Слова", href: "#top" },
          { label: "Идиомы", href: "#top" },
          { label: "Ситуации", href: "#top" }
        ]
      },
      {
        title: "Аккаунт",
        items: [
          { label: "Мои интересы", href: "#top" },
          { label: "Сохранённые", href: "#top" }
        ]
      },
      {
        title: "Награды",
        type: "awards"
      },
      {
        title: "Соушл",
        items: [
          { label: "GitHub", href: "#top", className: "social-link" },
          { label: "Telegram", href: "#top", className: "social-link" }
        ]
      },
      {
        title: "API",
        items: [
          {
            label: "Wikipedia",
            href: "https://www.mediawiki.org/wiki/API:Main_page",
            target: "_blank"
          },
          {
            label: "Google Gemini",
            href: "https://ai.google.dev/gemini-api/docs",
            target: "_blank"
          }
        ]
      }
    ];

    const menuGrid = document.getElementById("menuGrid");

    menuColumns.forEach((column) => {
      const section = document.createElement("section");
      section.className = "menu-column";

      const title = document.createElement("h2");
      title.className = "menu-title";
      title.textContent = column.title;
      section.appendChild(title);

      if (column.type === "awards") {
        const note = document.createElement("p");
        note.className = "award-note";
        note.appendChild(
          document.createTextNode(
            "Награды можно получить за разные активности. Если интересно, "
          )
        );

        const link = document.createElement("a");
        link.href = "#top";
        link.textContent = "ознакомься подробнее";
        note.appendChild(link);
        note.appendChild(document.createTextNode("."));

        section.appendChild(note);
      } else {
        const list = document.createElement("ul");
        list.className = "menu-links";

        column.items.forEach((item) => {
          const listItem = document.createElement("li");
          const link = document.createElement("a");

          link.href = item.href;
          link.textContent = item.label;

          if (item.className) {
            link.className = item.className;
          }

          if (item.target) {
            link.target = item.target;
            link.rel = "noopener noreferrer";
          }

          listItem.appendChild(link);
          list.appendChild(listItem);
        });

        section.appendChild(list);
      }

      menuGrid.appendChild(section);
    });

    fetch("./footer-content.html", { cache: "no-cache" })
      .then((response) => {
        if (!response.ok) {
          throw new Error("Не удалось загрузить текст подвала.");
        }
        return response.text();
      })
      .then((markup) => {
        document.getElementById("footerContent").innerHTML = markup;
      })
      .catch((error) => {
        console.error(error);
      });

    const backToTopButton = document.getElementById("backToTop");
    const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

    backToTopButton.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: reducedMotionQuery.matches ? "auto" : "smooth"
      });
    });

    const stories = [
      [
        "For the first few days in his new apartment, Daniel took the wrong street on his way home.",
        "On Friday, he noticed a little bakery on the corner and decided to stop for a coffee before catching the bus.",
        "The owner remembered him the next morning and asked how he liked the neighborhood. Daniel realized he was beginning to feel at home.",
        "After that, he took a different route whenever he had time. The walk was longer, but he kept finding places he wanted to come back to."
      ],
      [
        "Maya usually spent her lunch break at her desk, but one afternoon she decided to walk around the block.",
        "She found a small park behind the library and sat on a bench with her sandwich. A man nearby was teaching his dog to wait before crossing the path.",
        "The dog did not get it right the first time, but the man laughed and tried again. Maya stayed longer than she planned.",
        "The next day, she brought a book with her. Soon the park became part of her routine, even on busy weeks."
      ],
      [
        "When Chris started learning to cook, he chose recipes with only a few ingredients.",
        "One evening, he made pasta for a friend and forgot to buy tomatoes. Instead of ordering food, they looked through the kitchen and used what was already there.",
        "The meal was not exactly what the recipe promised, but it tasted good. His friend asked him to write down how he had made it.",
        "Chris kept the recipe on the fridge. It reminded him that getting started is often more useful than waiting for the perfect plan."
      ]
    ];

    const tickerViewport = document.getElementById("tickerViewport");
    const tickerTrack = document.getElementById("tickerTrack");
    const tickerCopy = document.getElementById("tickerCopy");
    const tickerCopyDuplicate = document.getElementById("tickerCopyDuplicate");

    const selectedStory = stories[Math.floor(Math.random() * stories.length)];
    const startIndex = Math.random() < 0.5 ? 1 : 2;
    const activeParagraphs = selectedStory.slice(startIndex);

    let tickerAnimation = null;
    let tickerDurationMs = 44000;
    let tickerCopyWidth = 1;
    let hoveringTicker = false;
    let draggingTicker = false;
    let keyboardFocusedTicker = false;
    let dragStartX = 0;
    let dragStartTime = 0;
    let activePointerId = null;
    let resizeTimer = null;

    function renderTickerCopy() {
      tickerCopy.replaceChildren();

      let paragraphIndex = 0;
      const minimumWidth = tickerViewport.clientWidth + 240;

      do {
        const phrase = document.createElement("span");
        phrase.textContent =
          activeParagraphs[paragraphIndex % activeParagraphs.length];

        tickerCopy.appendChild(phrase);
        paragraphIndex += 1;
      } while (
        tickerCopy.getBoundingClientRect().width < minimumWidth &&
        paragraphIndex < 60
      );

      tickerCopyDuplicate.replaceChildren(
        ...Array.from(tickerCopy.children, (phrase) => phrase.cloneNode(true))
      );

      tickerCopyWidth = tickerCopy.getBoundingClientRect().width;
      tickerDurationMs = Math.max(44000, (tickerCopyWidth / 24) * 1000);

      tickerTrack.style.setProperty(
        "--ticker-duration",
        `${tickerDurationMs / 1000}s`
      );

      requestAnimationFrame(captureTickerAnimation);
    }

    function captureTickerAnimation() {
      const animations = tickerTrack.getAnimations();
      tickerAnimation =
        animations.find((animation) => animation.animationName === "ticker-scroll") ||
        animations[0] ||
        null;

      updateTickerPlayback();
    }

    function updateTickerPlayback() {
      if (!tickerAnimation) return;

      const shouldPause =
        hoveringTicker ||
        draggingTicker ||
        keyboardFocusedTicker ||
        reducedMotionQuery.matches;

      if (shouldPause) {
        tickerAnimation.pause();
      } else {
        tickerAnimation.play();
      }
    }

    function getTickerTime() {
      if (!tickerAnimation) return 0;

      const currentTime = Number(tickerAnimation.currentTime) || 0;
      return ((currentTime % tickerDurationMs) + tickerDurationMs) % tickerDurationMs;
    }

    function setTickerTime(time) {
      if (!tickerAnimation) return;

      const normalizedTime =
        ((time % tickerDurationMs) + tickerDurationMs) % tickerDurationMs;

      tickerAnimation.pause();
      tickerAnimation.currentTime = normalizedTime;
    }

    function moveTickerByPixels(pixels) {
      if (!tickerAnimation || tickerCopyWidth <= 0) return;

      const pixelsPerMillisecond = tickerCopyWidth / tickerDurationMs;
      setTickerTime(getTickerTime() + pixels / pixelsPerMillisecond);
    }

    tickerViewport.addEventListener("pointerenter", (event) => {
      if (event.pointerType !== "touch") {
        hoveringTicker = true;
        updateTickerPlayback();
      }
    });

    tickerViewport.addEventListener("pointerleave", (event) => {
      if (event.pointerType !== "touch") {
        hoveringTicker = false;
        updateTickerPlayback();
      }
    });

    tickerViewport.addEventListener(
      "wheel",
      (event) => {
        const unit =
          event.deltaMode === 1
            ? 32
            : event.deltaMode === 2
              ? tickerViewport.clientWidth
              : 1;

        const deltaX = event.deltaX * unit;
        const deltaY = event.deltaY * unit;
        let horizontalDelta = deltaX;

        if (event.shiftKey && Math.abs(horizontalDelta) < 0.5) {
          horizontalDelta = deltaY;
        }

        const isHorizontalGesture =
          event.shiftKey
            ? Math.abs(horizontalDelta) > 0.5
            : Math.abs(deltaX) > 0.5 && Math.abs(deltaX) >= Math.abs(deltaY);

        if (!isHorizontalGesture) return;

        event.preventDefault();
        moveTickerByPixels(horizontalDelta);
      },
      { passive: false }
    );

    tickerViewport.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;

      draggingTicker = true;
      activePointerId = event.pointerId;
      dragStartX = event.clientX;
      dragStartTime = getTickerTime();

      tickerViewport.classList.add("is-dragging");

      if (tickerViewport.setPointerCapture) {
        tickerViewport.setPointerCapture(event.pointerId);
      }

      updateTickerPlayback();
    });

    tickerViewport.addEventListener("pointermove", (event) => {
      if (!draggingTicker || event.pointerId !== activePointerId) return;

      const distance = event.clientX - dragStartX;
      moveTickerByPixels(0);
      setTickerTime(
        dragStartTime - (distance / tickerCopyWidth) * tickerDurationMs
      );
    });

    function finishTickerDrag(event) {
      if (!draggingTicker) return;
      if (event && event.pointerId !== activePointerId) return;

      draggingTicker = false;
      activePointerId = null;
      tickerViewport.classList.remove("is-dragging");

      if (
        event &&
        tickerViewport.hasPointerCapture &&
        tickerViewport.hasPointerCapture(event.pointerId)
      ) {
        tickerViewport.releasePointerCapture(event.pointerId);
      }

      updateTickerPlayback();
    }

    tickerViewport.addEventListener("pointerup", finishTickerDrag);
    tickerViewport.addEventListener("pointercancel", finishTickerDrag);

    tickerViewport.addEventListener("focus", () => {
      keyboardFocusedTicker = tickerViewport.matches(":focus-visible");
      updateTickerPlayback();
    });

    tickerViewport.addEventListener("blur", () => {
      keyboardFocusedTicker = false;
      updateTickerPlayback();
    });

    tickerViewport.addEventListener("keydown", (event) => {
      keyboardFocusedTicker = true;
      updateTickerPlayback();

      const step = event.shiftKey ? 320 : 120;

      if (event.key === "ArrowRight") {
        event.preventDefault();
        moveTickerByPixels(step);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        moveTickerByPixels(-step);
      } else if (event.key === "PageDown") {
        event.preventDefault();
        moveTickerByPixels(tickerViewport.clientWidth * 0.8);
      } else if (event.key === "PageUp") {
        event.preventDefault();
        moveTickerByPixels(-tickerViewport.clientWidth * 0.8);
      } else if (event.key === "Home") {
        event.preventDefault();
        setTickerTime(0);
      } else if (event.key === "End") {
        event.preventDefault();
        setTickerTime(tickerDurationMs - 1);
      }
    });

    if (reducedMotionQuery.addEventListener) {
      reducedMotionQuery.addEventListener("change", updateTickerPlayback);
    }

    renderTickerCopy();

    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(renderTickerCopy, 150);
    });
  </script>
</body>
</html>
