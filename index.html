<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffffff" />

  <title>Fluent — английский без зубрёжки</title>

  <style>
    :root {
      color-scheme: light;

      --background: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-menu: rgba(29, 29, 31, 0.7);
      --apple-blue: #0071e3;

      --content-width: 1100px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text-primary);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .page-shell {
      display: flex;
      flex-direction: column;
      width: min(var(--content-width), calc(100% - 80px));
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding-block: 88px 42px;
    }

    .site-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      column-gap: clamp(40px, 5vw, 64px);
      align-items: start;
    }

    .brand-block {
      max-width: 440px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      line-height: 0;
      text-decoration: none;
    }

    .brand-logo {
      display: block;
      width: auto;
      height: 46px;
      max-width: 260px;
      object-fit: contain;
      object-position: left center;
    }

    .brand:focus-visible {
      outline: 2px solid var(--apple-blue);
      outline-offset: 6px;
      border-radius: 4px;
    }

    .tagline {
      max-width: 410px;
      margin: 21px 0 0;
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.015em;
    }

    .site-navigation {
      display: grid;
      width: 320px;
      justify-self: end;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 10px;
    }

    .menu-column {
      min-width: 0;
    }

    .menu-heading {
      margin: 0 0 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.01em;
      text-align: left;
    }

    .menu-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      color: var(--text-menu);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      transition: color 160ms ease, opacity 160ms ease;
    }

    .menu-link:hover {
      color: var(--text-primary);
    }

    .menu-link:active {
      opacity: 0.55;
    }

    .menu-link:focus-visible {
      outline: 2px solid var(--apple-blue);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .menu-arrow {
      flex: none;
      font-size: 12px;
      line-height: 1;
    }

    .site-footer {
      width: 100%;
      margin-top: auto;
      padding-top: clamp(88px, 13vh, 140px);
    }

    /* Ненавязчивая строка над изображением */
    .ticker {
      display: flex;
      align-items: center;
      width: 100%;
      height: 46px;
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid rgba(29, 29, 31, 0.04);
      border-radius: 12px;
      background: #f5f5f7;
    }

    .ticker__track {
      display: flex;
      align-items: center;
      width: max-content;
      height: 100%;
      animation: ticker-scroll 34s linear infinite;
      will-change: transform;
    }

    .ticker__group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 20px;
      padding-inline: 24px;
      white-space: nowrap;
    }

    .ticker__item {
      color: #515154;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.075em;
      text-transform: uppercase;
    }

    .ticker__separator {
      color: #a1a1a6;
      font-size: 13px;
      line-height: 1;
    }

    @keyframes ticker-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .footer-image {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin-inline: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker__track {
        width: 100%;
        animation: none;
      }

      .ticker__group[aria-hidden="true"] {
        display: none;
      }

      .ticker__group:first-child {
        width: 100%;
        justify-content: center;
      }

      .ticker__group:first-child .ticker__separator,
      .ticker__group:first-child .ticker__item:not(:first-of-type) {
        display: none;
      }
    }

    @media (max-width: 920px) {
      .page-shell {
        width: min(760px, calc(100% - 64px));
        padding-top: 62px;
      }

      .site-main {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 48px;
      }

      .brand-block {
        max-width: 440px;
      }

      .site-navigation {
        width: min(100%, 320px);
        justify-self: start;
      }
    }

    @media (max-width: 640px) {
      .page-shell {
        width: calc(100% - 40px);
        padding-block: 38px 26px;
      }

      .site-main {
        row-gap: 40px;
      }

      .site-navigation {
        width: 100%;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 10px;
      }

      .brand-logo {
        height: 40px;
      }

      .tagline {
        font-size: 16px;
      }

      .site-footer {
        padding-top: 84px;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <main class="site-main" id="top">
      <section class="brand-block" aria-label="О Fluent">
        <a class="brand" href="./" aria-label="Fluent — главная страница">
          <img
            class="brand-logo"
            src="./public/fluent.png"
            alt="Fluent"
          />
        </a>

        <h1 class="tagline">
          Английский не такой сложный.<br />
          Зачем зубрить, если можно практиковаться и становиться увереннее?
        </h1>
      </section>

      <nav
        class="site-navigation"
        id="site-navigation"
        aria-label="Основные разделы"
      ></nav>
    </main>

    <footer class="site-footer">
      <div
        class="ticker"
        id="ticker"
        role="group"
        aria-label="Идеи для практики английского"
      >
        <div class="ticker__track" id="ticker-track"></div>
      </div>

      <img
        class="footer-image"
        src="./public/footer.png?v=3"
        alt=""
      />
    </footer>
  </div>

  <script>
    const practiceItems = [
      "Заглушка",
      "Ещё одна",
      "Заглушка",
      "Ещё одна",
    ];

    const optionsItems = [
      "Заглушка",
      "Ещё одна",
      "Заглушка",
    ];

    const socialItems = [
      { label: "GitHub", arrow: true },
      { label: "Telegram", arrow: true },
    ];

    const menuColumns = [
      { title: "Практика", items: practiceItems },
      { title: "Опции", items: optionsItems },
      { title: "Соушл", items: socialItems },
    ];

    const navigation = document.querySelector("#site-navigation");

    menuColumns.forEach((column, index) => {
      const group = document.createElement("section");
      group.className = "menu-column";

      const heading = document.createElement("h2");
      heading.className = "menu-heading";
      heading.id = `menu-heading-${index}`;
      heading.textContent = column.title;

      group.setAttribute("aria-labelledby", heading.id);

      const list = document.createElement("ul");
      list.className = "menu-list";

      column.items.forEach((item) => {
        const entry = typeof item === "string"
          ? { label: item }
          : item;

        const listItem = document.createElement("li");
        const link = document.createElement("a");

        link.className = "menu-link";
        link.href = "./";

        if (entry.arrow) {
          const arrow = document.createElement("span");
          arrow.className = "menu-arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "↗";
          link.append(arrow);
        }

        const label = document.createElement("span");
        label.textContent = entry.label;

        link.append(label);
        listItem.append(link);
        list.append(listItem);
      });

      group.append(heading, list);
      navigation.append(group);
    });

    // Один и тот же набор фраз выводится дважды,
    // чтобы анимация могла зацикливаться без скачка.
    const tickerPhrases = [
      "Think in English",
      "Learn phrases in context",
      "Express your ideas",
      "Practice at your own pace",
    ];

    const tickerTrack = document.querySelector("#ticker-track");

    for (let copy = 0; copy < 2; copy += 1) {
      const group = document.createElement("div");
      group.className = "ticker__group";

      if (copy === 1) {
        group.setAttribute("aria-hidden", "true");
      }

      tickerPhrases.forEach((phrase, index) => {
        if (index > 0) {
          const separator = document.createElement("span");
          separator.className = "ticker__separator";
          separator.setAttribute("aria-hidden", "true");
          separator.textContent = "·";
          group.append(separator);
        }

        const item = document.createElement("span");
        item.className = "ticker__item";
        item.textContent = phrase;
        group.append(item);
      });

      tickerTrack.append(group);
    }
  </script>
</body>
</html>
