<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffffff" />

  <title>Fluent — английский без зубрёжки</title>

  <style>
    :root {
      color-scheme: light;

      --background: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-menu: rgba(29, 29, 31, 0.7);
      --apple-blue: #0071e3;

      --content-width: 1100px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text-primary);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .page-shell {
      display: flex;
      flex-direction: column;
      width: min(var(--content-width), calc(100% - 80px));
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding-block: 88px 42px;
    }

    .site-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 460px;
      column-gap: clamp(40px, 5vw, 64px);
      align-items: start;
    }

    .brand-block {
      max-width: 440px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      line-height: 0;
      text-decoration: none;
    }

    .brand-logo {
      display: block;
      width: auto;
      height: 46px;
      max-width: 260px;
      object-fit: contain;
      object-position: left center;
    }

    .brand:focus-visible {
      outline: 2px solid var(--apple-blue);
      outline-offset: 6px;
      border-radius: 4px;
    }

    .tagline {
      max-width: 410px;
      margin: 21px 0 0;
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.015em;
    }

    .site-navigation {
      display: grid;
      width: 460px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 24px;
      justify-self: end;
    }

    .menu-column {
      min-width: 0;
    }

    .menu-heading {
      margin: 0 0 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.01em;
      text-align: left;
    }

    .menu-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      color: var(--text-menu);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      transition: color 160ms ease, opacity 160ms ease;
    }

    .menu-link:hover {
      color: var(--text-primary);
    }

    .menu-link:active {
      opacity: 0.55;
    }

    .menu-link:focus-visible {
      outline: 2px solid var(--apple-blue);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .menu-arrow {
      flex: none;
      font-size: 12px;
      line-height: 1;
    }

    .site-footer {
      width: 100%;
      margin-top: auto;
      padding-top: clamp(88px, 13vh, 140px);
    }

    /* Бегущая строка с англоязычным отрывком */
    .ticker {
      width: 100%;
      min-height: 48px;
      margin-bottom: 18px;
      overflow: hidden;
      background: #f5f5f7;
    }

    .ticker__viewport {
      width: 100%;
      overflow: hidden;

      /* Плавно скрываем текст у левого и правого краёв */
      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        rgba(0, 0, 0, 0.32) 3%,
        #000 10%,
        #000 90%,
        rgba(0, 0, 0, 0.32) 97%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to right,
        transparent 0%,
        rgba(0, 0, 0, 0.32) 3%,
        #000 10%,
        #000 90%,
        rgba(0, 0, 0, 0.32) 97%,
        transparent 100%
      );
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }

    .ticker__track {
      display: flex;
      width: max-content;
      animation: ticker-scroll var(--ticker-duration, 60s) linear infinite;
      will-change: transform;
    }

    .ticker__group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 18px;
      padding: 14px 24px;
      white-space: nowrap;
    }

    .ticker__excerpt {
      color: #6e6e73;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .ticker__credit {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 7px;
      color: #86868b;
      font-size: 11px;
      white-space: nowrap;
    }

    .ticker__source,
    .ticker__license {
      color: inherit;
      font-size: inherit;
      font-weight: 400;
      text-decoration: none;
    }

    .ticker__source:hover,
    .ticker__license:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .ticker__status {
      color: #86868b;
      font-size: 12px;
    }

    .ticker--static .ticker__track {
      width: 100%;
      animation: none;
    }

    .footer-image {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin-inline: auto;
    }

    @keyframes ticker-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .ticker:hover .ticker__track,
    .ticker:focus-within .ticker__track {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker__viewport {
        -webkit-mask-image: none;
        mask-image: none;
      }

      .ticker__track {
        width: 100%;
        animation: none;
        transform: none;
      }

      .ticker__group[aria-hidden="true"] {
        display: none;
      }

      .ticker__group:first-child {
        width: 100%;
        flex-basis: 100%;
        flex-wrap: wrap;
        gap: 8px 14px;
        padding-block: 14px;
        white-space: normal;
      }

      .ticker__excerpt {
        white-space: normal;
      }

      .ticker__credit {
        flex-wrap: wrap;
        white-space: normal;
      }
    }

    @media (max-width: 920px) {
      .page-shell {
        width: min(760px, calc(100% - 64px));
        padding-top: 62px;
      }

      .site-main {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 48px;
      }

      .brand-block {
        max-width: 440px;
      }

      .site-navigation {
        width: min(100%, 460px);
        justify-self: start;
      }
    }

    @media (max-width: 640px) {
      .page-shell {
        width: calc(100% - 40px);
        padding-block: 38px 26px;
      }

      .site-main {
        row-gap: 40px;
      }

      .site-navigation {
        width: 100%;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 24px;
        row-gap: 32px;
      }

      .brand-logo {
        height: 40px;
      }

      .tagline {
        font-size: 16px;
      }

      .site-footer {
        padding-top: 84px;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <main class="site-main" id="top">
      <section class="brand-block" aria-label="О Fluent">
        <a class="brand" href="./" aria-label="Fluent — главная страница">
          <img
            class="brand-logo"
            src="./public/fluent.png"
            alt="Fluent"
          />
        </a>

        <h1 class="tagline">
          Английский не такой сложный.<br />
          Зачем зубрить, если можно практиковаться и становиться увереннее?
        </h1>
      </section>

      <nav
        class="site-navigation"
        id="site-navigation"
        aria-label="Основные разделы"
      ></nav>
    </main>

    <footer class="site-footer">
      <section
        class="ticker ticker--static"
        id="reading-ticker"
        role="region"
        aria-label="Случайный отрывок на английском"
        aria-busy="true"
      >
        <div class="ticker__viewport">
          <div class="ticker__track" id="ticker-track">
            <div class="ticker__group">
              <span class="ticker__status">Loading an English excerpt…</span>
            </div>
          </div>
        </div>
      </section>

      <img
        class="footer-image"
        src="./public/footer.png?v=5"
        alt=""
      />
    </footer>
  </div>

  <script>
    const practiceItems = [
      "Заглушка",
      "Ещё одна",
      "Заглушка",
      "Ещё одна",
    ];

    const optionsItems = [
      "Заглушка",
      "Ещё одна",
      "Заглушка",
    ];

    const rewardsItems = [
      "Заглушка",
      "Ещё одна",
    ];

    const socialItems = [
      { label: "GitHub", arrow: true },
      { label: "Telegram", arrow: true },
    ];

    const menuColumns = [
      { title: "Практика", items: practiceItems },
      { title: "Опции", items: optionsItems },
      { title: "Награды", items: rewardsItems },
      { title: "Соушл", items: socialItems },
    ];

    const navigation = document.querySelector("#site-navigation");

    menuColumns.forEach((column, index) => {
      const group = document.createElement("section");
      group.className = "menu-column";

      const heading = document.createElement("h2");
      heading.className = "menu-heading";
      heading.id = `menu-heading-${index}`;
      heading.textContent = column.title;

      group.setAttribute("aria-labelledby", heading.id);

      const list = document.createElement("ul");
      list.className = "menu-list";

      column.items.forEach((item) => {
        const entry = typeof item === "string"
          ? { label: item }
          : item;

        const listItem = document.createElement("li");
        const link = document.createElement("a");

        link.className = "menu-link";
        link.href = "./";

        if (entry.arrow) {
          const arrow = document.createElement("span");
          arrow.className = "menu-arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "↗";
          link.append(arrow);
        }

        const label = document.createElement("span");
        label.textContent = entry.label;

        link.append(label);
        listItem.append(link);
        list.append(listItem);
      });

      group.append(heading, list);
      navigation.append(group);
    });

    const ticker = document.querySelector("#reading-ticker");
    const tickerTrack = document.querySelector("#ticker-track");

    const wikipediaApi = "https://simple.wikipedia.org/w/api.php";
    const wikipediaLicense =
      "https://creativecommons.org/licenses/by-sa/4.0/";

    function splitIntoParagraphs(extract) {
      return extract
        .replace(/\r/g, "")
        .split(/\n+/)
        .map((paragraph) => paragraph.replace(/\s+/g, " ").trim())
        .filter((paragraph) => paragraph.length >= 50);
    }

    function chooseStartingParagraph(paragraphCount) {
      if (paragraphCount <= 1) {
        return 0;
      }

      // Чаще начинаем со второго или третьего абзаца.
      const preferredParagraphs = [1, 2].filter(
        (index) => index < paragraphCount
      );

      if (
        preferredParagraphs.length > 0 &&
        Math.random() < 0.72
      ) {
        const randomIndex = Math.floor(
          Math.random() * preferredParagraphs.length
        );

        return preferredParagraphs[randomIndex];
      }

      return Math.floor(Math.random() * paragraphCount);
    }

    function limitExcerpt(text, maxLength = 360) {
      if (text.length <= maxLength) {
        return text;
      }

      const beginning = text.slice(0, maxLength);
      const lastSentenceEnd = Math.max(
        beginning.lastIndexOf(". "),
        beginning.lastIndexOf("! "),
        beginning.lastIndexOf("? ")
      );

      if (lastSentenceEnd > maxLength * 0.55) {
        return `${beginning.slice(0, lastSentenceEnd + 1).trim()}…`;
      }

      const lastSpace = beginning.lastIndexOf(" ");
      const cutAt = lastSpace > 0 ? lastSpace : maxLength;

      return `${beginning.slice(0, cutAt).trim()}…`;
    }

    function makeExcerpt(paragraphs, startIndex) {
      const selectedParagraphs = [];
      let characterCount = 0;

      for (
        let index = startIndex;
        index < paragraphs.length && characterCount < 360;
        index += 1
      ) {
        selectedParagraphs.push(paragraphs[index]);
        characterCount += paragraphs[index].length + 1;
      }

      return limitExcerpt(selectedParagraphs.join(" "));
    }

    function createTickerGroup({
      title,
      pageUrl,
      excerpt,
      duplicate,
    }) {
      const group = document.createElement("div");
      group.className = "ticker__group";

      if (duplicate) {
        group.setAttribute("aria-hidden", "true");
      }

      const excerptText = document.createElement("span");
      excerptText.className = "ticker__excerpt";
      excerptText.textContent = excerpt;

      const credit = document.createElement("span");
      credit.className = "ticker__credit";

      const sourceName = document.createElement("span");
      sourceName.textContent = "Source: Simple English Wikipedia";

      const sourceLink = document.createElement("a");
      sourceLink.className = "ticker__source";
      sourceLink.href = pageUrl;
      sourceLink.target = "_blank";
      sourceLink.rel = "noopener noreferrer";
      sourceLink.textContent = title;
      sourceLink.setAttribute(
        "aria-label",
        `Read “${title}” on Simple English Wikipedia`
      );

      const separator = document.createElement("span");
      separator.setAttribute("aria-hidden", "true");
      separator.textContent = "·";

      const licenseLink = document.createElement("a");
      licenseLink.className = "ticker__license";
      licenseLink.href = wikipediaLicense;
      licenseLink.target = "_blank";
      licenseLink.rel = "noopener noreferrer";
      licenseLink.textContent = "CC BY-SA 4.0";
      licenseLink.setAttribute(
        "aria-label",
        "Content license: Creative Commons Attribution-ShareAlike 4.0"
      );

      if (duplicate) {
        sourceLink.tabIndex = -1;
        licenseLink.tabIndex = -1;
      }

      credit.append(
        sourceName,
        sourceLink,
        separator,
        licenseLink
      );

      // Отрывок идёт первым, атрибуция — в конце.
      group.append(excerptText, credit);

      return group;
    }

    function showTickerStatus(message) {
      tickerTrack.replaceChildren();

      const group = document.createElement("div");
      group.className = "ticker__group";

      const status = document.createElement("span");
      status.className = "ticker__status";
      status.textContent = message;

      group.append(status);
      tickerTrack.append(group);

      ticker.classList.add("ticker--static");
      ticker.setAttribute("aria-busy", "false");
    }

    function showTickerArticle({ title, pageUrl, excerpt }) {
      tickerTrack.replaceChildren();

      tickerTrack.append(
        createTickerGroup({
          title,
          pageUrl,
          excerpt,
          duplicate: false,
        }),
        createTickerGroup({
          title,
          pageUrl,
          excerpt,
          duplicate: true,
        })
      );

      ticker.classList.remove("ticker--static");
      ticker.setAttribute("aria-busy", "false");
      ticker.setAttribute(
        "aria-label",
        `English excerpt from Simple English Wikipedia: ${title}`
      );

      requestAnimationFrame(() => {
        const firstGroup = tickerTrack.querySelector(".ticker__group");

        if (!firstGroup) {
          return;
        }

        const pixelsPerSecond = 34;
        const duration = Math.max(
          45,
          firstGroup.getBoundingClientRect().width / pixelsPerSecond
        );

        tickerTrack.style.setProperty(
          "--ticker-duration",
          `${duration.toFixed(1)}s`
        );
      });
    }

    async function loadRandomEnglishExcerpt() {
      try {
        const params = new URLSearchParams({
          action: "query",
          generator: "random",
          grnnamespace: "0",
          grnlimit: "1",
          prop: "extracts",
          explaintext: "1",
          exchars: "8000",
          format: "json",
          formatversion: "2",
          origin: "*",
        });

        const response = await fetch(
          `${wikipediaApi}?${params.toString()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            `Wikipedia API returned ${response.status}`
          );
        }

        const data = await response.json();
        const pages = data?.query?.pages;

        const page = Array.isArray(pages)
          ? pages[0]
          : Object.values(pages ?? {})[0];

        if (!page?.extract || !page?.pageid) {
          throw new Error("The random article has no readable text.");
        }

        const paragraphs = splitIntoParagraphs(page.extract);

        if (paragraphs.length === 0) {
          throw new Error("Could not find paragraphs in the article.");
        }

        const startIndex = chooseStartingParagraph(paragraphs.length);
        const excerpt = makeExcerpt(paragraphs, startIndex);

        showTickerArticle({
          title: page.title,
          pageUrl: `https://simple.wikipedia.org/?curid=${page.pageid}`,
          excerpt,
        });
      } catch (error) {
        console.error("Could not load the English excerpt:", error);

        showTickerStatus(
          "The English excerpt could not be loaded. Try refreshing the page."
        );
      }
    }

    loadRandomEnglishExcerpt();
  </script>
</body>
</html>
