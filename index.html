<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffffff" />

  <title>Fluent — английский без зубрёжки</title>

  <style>
    :root {
      color-scheme: light;

      --background: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-menu: rgba(29, 29, 31, 0.7);
      --apple-blue: #0071e3;

      --content-width: 1100px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
      scrollbar-gutter: stable;
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: clip;
      background: var(--background);
      color: var(--text-primary);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    img {
      -webkit-user-drag: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .page-shell {
      display: flex;
      flex-direction: column;
      width: min(var(--content-width), calc(100% - 80px));
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding-block: 88px 42px;
    }

    .site-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 650px;
      column-gap: clamp(32px, 4vw, 44px);
      align-items: start;
    }

    .brand-block {
      max-width: 440px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      line-height: 0;
      text-decoration: none;
    }

    .brand-logo {
      display: block;
      width: auto;
      height: 46px;
      max-width: 260px;
      object-fit: contain;
      object-position: left center;
    }

    .brand:focus-visible {
      outline: 2px solid var(--apple-blue);
      outline-offset: 6px;
      border-radius: 4px;
    }

    .tagline {
      max-width: 410px;
      margin: 21px 0 0;
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.015em;
    }

    .site-navigation {
      display: grid;
      width: 650px;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      column-gap: 18px;
      justify-self: end;
    }

    .menu-column {
      min-width: 0;
    }

    .menu-heading {
      margin: 0 0 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.01em;
      text-align: left;
    }

    .menu-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      max-width: 100%;
      color: var(--text-menu);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      transition: color 160ms ease, opacity 160ms ease;
    }

    .menu-link:hover {
      color: var(--text-primary);
    }

    .menu-link:active {
      opacity: 0.55;
    }

    .menu-link:focus-visible {
      outline: 2px solid var(--apple-blue);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .menu-link__label {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .menu-arrow {
      flex: none;
      font-size: 12px;
      line-height: 1;
    }

    .site-footer {
      width: 100%;
      margin-top: auto;
      padding-top: clamp(88px, 13vh, 140px);
    }

    .ticker {
      --ticker-edge-width: clamp(58px, 11vw, 122px);

      position: relative;
      isolation: isolate;
      width: 100%;
      height: 52px;
      margin-bottom: 18px;
      overflow: hidden;
      overscroll-behavior-x: none;
      background: linear-gradient(
        to right,
        #ffffff 0%,
        #f5f5f7 11%,
        #f5f5f7 89%,
        #ffffff 100%
      );

      /* Текст бегущей строки нельзя выделить. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .ticker__viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 52px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: none;
      overscroll-behavior-inline: none;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      scroll-behavior: auto;
      touch-action: pan-x pan-y;
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .ticker__viewport::-webkit-scrollbar {
      display: none;
    }

    .ticker__viewport.is-dragging {
      cursor: grabbing;
    }

    .ticker__viewport:focus-visible {
      outline: 2px solid var(--apple-blue);
      outline-offset: -2px;
    }

    .ticker__viewport,
    .ticker__viewport * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .ticker__track {
      display: flex;
      width: max-content;
      min-width: max-content;
      height: 100%;
      align-items: stretch;
    }

    .ticker__group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 18px;
      height: 100%;
      padding-inline: 24px;
      white-space: nowrap;
    }

    .ticker__text {
      color: #5f5f64;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .ticker__separator {
      flex: none;
      color: #a1a1a6;
      font-size: 13px;
      line-height: 1;
    }

    .ticker__edge {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      width: var(--ticker-edge-width);
      pointer-events: none;
      --edge-direction: to right;
    }

    .ticker__edge--left {
      left: 0;
    }

    .ticker__edge--right {
      right: 0;
      --edge-direction: to left;
    }

    .ticker__blur-band {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: var(--band-layer);
      width: var(--band-width);
      background: linear-gradient(
        var(--edge-direction),
        rgba(255, 255, 255, var(--veil)) 0%,
        rgba(255, 255, 255, 0) 100%
      );
      -webkit-backdrop-filter: blur(var(--blur));
      backdrop-filter: blur(var(--blur));
      -webkit-mask-image: linear-gradient(
        var(--edge-direction),
        #000 0%,
        rgba(0, 0, 0, 0.72) 52%,
        transparent 100%
      );
      mask-image: linear-gradient(
        var(--edge-direction),
        #000 0%,
        rgba(0, 0, 0, 0.72) 52%,
        transparent 100%
      );
    }

    .ticker__blur-band--soft {
      --band-width: 100%;
      --band-layer: 1;
      --blur: 1px;
      --veil: 0.12;
    }

    .ticker__blur-band--medium {
      --band-width: 68%;
      --band-layer: 2;
      --blur: 2.8px;
      --veil: 0.22;
    }

    .ticker__blur-band--strong {
      --band-width: 40%;
      --band-layer: 3;
      --blur: 5px;
      --veil: 0.52;
    }

    .ticker__edge--right .ticker__blur-band {
      right: 0;
      left: auto;
    }

    .ticker--static .ticker__track {
      animation: none;
      transform: none;
    }

    .footer-image {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin-inline: auto;
    }

    @media (max-width: 1080px) {
      .page-shell {
        width: min(920px, calc(100% - 64px));
        padding-top: 62px;
      }

      .site-main {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 48px;
      }

      .brand-block {
        max-width: 440px;
      }

      .site-navigation {
        width: min(100%, 650px);
        justify-self: start;
      }
    }

    @media (max-width: 640px) {
      .page-shell {
        width: calc(100% - 40px);
        padding-block: 38px 26px;
      }

      .site-main {
        row-gap: 40px;
      }

      .site-navigation {
        width: 100%;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 24px;
        row-gap: 32px;
      }

      .brand-logo {
        height: 40px;
      }

      .tagline {
        font-size: 16px;
      }

      .site-footer {
        padding-top: 84px;
      }

      .ticker {
        --ticker-edge-width: 52px;
      }

      .ticker__group {
        gap: 14px;
        padding-inline: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker__edge {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <main class="site-main" id="top">
      <section class="brand-block" aria-label="О Fluent">
        <a class="brand" href="./" aria-label="Fluent — главная страница">
          <img
            class="brand-logo"
            src="./public/fluent.png"
            alt="Fluent"
            draggable="false"
          />
        </a>

        <h1 class="tagline">
          Английский не такой сложный.<br />
          Зачем зубрить, если можно практиковаться и становиться увереннее?
        </h1>
      </section>

      <nav
        class="site-navigation"
        id="site-navigation"
        aria-label="Основные разделы"
      ></nav>
    </main>

    <footer class="site-footer">
      <section
        class="ticker ticker--static"
        id="reading-ticker"
        aria-label="Короткий английский текст для практики"
      >
        <div
          class="ticker__viewport"
          id="ticker-viewport"
          tabindex="0"
          role="region"
          aria-label="Прокручиваемый английский текст"
        >
          <div class="ticker__track" id="ticker-track">
            <div class="ticker__group">
              <span class="ticker__text">
                Small moments can lead to better conversations.
              </span>
            </div>
          </div>
        </div>

        <div class="ticker__edge ticker__edge--left" aria-hidden="true">
          <span class="ticker__blur-band ticker__blur-band--soft"></span>
          <span class="ticker__blur-band ticker__blur-band--medium"></span>
          <span class="ticker__blur-band ticker__blur-band--strong"></span>
        </div>

        <div class="ticker__edge ticker__edge--right" aria-hidden="true">
          <span class="ticker__blur-band ticker__blur-band--soft"></span>
          <span class="ticker__blur-band ticker__blur-band--medium"></span>
          <span class="ticker__blur-band ticker__blur-band--strong"></span>
        </div>
      </section>

      <img
        class="footer-image"
        src="./public/footer.png?v=7"
        alt=""
        draggable="false"
      />
    </footer>
  </div>

  <script>
    const practiceItems = [
      "Заглушка",
      "Ещё одна",
      "Заглушка",
      "Ещё одна",
    ];

    const optionsItems = [
      "Заглушка",
      "Ещё одна",
      "Заглушка",
    ];

    const rewardsItems = [
      "Заглушка",
      "Ещё одна",
    ];

    const socialItems = [
      { label: "GitHub", arrow: true },
      { label: "Telegram", arrow: true },
    ];

    const apiItems = [
      {
        label: "Wikipedia",
        href: "https://www.mediawiki.org/wiki/API:Main_page",
        external: true,
        arrow: true,
      },
      {
        label: "Google Gemini",
        href: "https://ai.google.dev/gemini-api/docs",
        external: true,
        arrow: true,
      },
    ];

    const menuColumns = [
      { title: "Практика", items: practiceItems },
      { title: "Опции", items: optionsItems },
      { title: "Награды", items: rewardsItems },
      { title: "Соушл", items: socialItems },
      { title: "API", items: apiItems },
    ];

    const navigation = document.querySelector("#site-navigation");

    menuColumns.forEach((column, index) => {
      const group = document.createElement("section");
      group.className = "menu-column";

      const heading = document.createElement("h2");
      heading.className = "menu-heading";
      heading.id = `menu-heading-${index}`;
      heading.textContent = column.title;

      group.setAttribute("aria-labelledby", heading.id);

      const list = document.createElement("ul");
      list.className = "menu-list";

      column.items.forEach((item) => {
        const entry = typeof item === "string"
          ? { label: item }
          : item;

        const listItem = document.createElement("li");
        const link = document.createElement("a");

        link.className = "menu-link";
        link.href = entry.href || "./";

        if (entry.external) {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }

        if (entry.arrow) {
          const arrow = document.createElement("span");
          arrow.className = "menu-arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "↗";
          link.append(arrow);
        }

        const label = document.createElement("span");
        label.className = "menu-link__label";
        label.textContent = entry.label;

        link.append(label);
        listItem.append(link);
        list.append(listItem);
      });

      group.append(heading, list);
      navigation.append(group);
    });

    const readingStories = [
      [
        "When Maya moved to a new city, she decided to walk home from work instead of taking the bus.",
        "At first, she used the same quiet street every day. One evening, she noticed a small bookstore with a handwritten sign in the window. It said, “Tell us what you’re reading.”",
        "The next day, Maya went inside and asked the owner for a recommendation. They talked about mystery novels, favorite characters, and the best places to get coffee nearby.",
        "Maya left with a book and three new places to visit. Her English wasn’t perfect, but the conversation felt easy.",
      ],
      [
        "On Saturday mornings, Ben liked to visit the farmers market before it got busy.",
        "One weekend, he stopped at a table full of fresh peaches. The seller asked if he wanted to try one, and Ben said yes. It was sweeter than he expected.",
        "He asked how the peaches were grown and learned that the farm was just outside town. The seller also shared a simple recipe for peach pie.",
        "Ben bought a small bag and went home smiling. He had practiced English, learned something new, and found dessert for the evening.",
      ],
      [
        "Olivia was nervous about joining her first neighborhood book club.",
        "She almost stayed home, but she had already finished the book, so she went. The group was smaller than she expected, and everyone took turns sharing one thing they liked.",
        "When it was Olivia’s turn, she talked about the main character and asked the others what they thought. A woman across the table agreed and added an idea Olivia hadn’t considered.",
        "By the end of the evening, Olivia had shared her opinion and made plans to come back. She realized a good conversation often starts with one simple question.",
      ],
      [
        "A few months ago, Daniel started taking a different route to the office.",
        "The new street was a little longer, but it passed a quiet park. Most mornings, he saw an older man feeding birds near the fountain.",
        "One day, Daniel asked what kind of birds they were. The man told him their names and pointed out a bright red cardinal in a tree. Daniel listened, then asked how long the birds had visited the park.",
        "Now Daniel leaves home ten minutes earlier. The walk gives him fresh air and a small daily conversation to look forward to.",
      ],
    ];

    const ticker = document.querySelector("#reading-ticker");
    const tickerViewport = document.querySelector("#ticker-viewport");
    const tickerTrack = document.querySelector("#ticker-track");
    const reducedMotionQuery = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const AUTO_SCROLL_SPEED = 24;
    const MIN_TICKER_CYCLE_WIDTH = 1180;

    let currentTickerText = "";
    let tickerCycleWidth = 0;
    let lastFrameTime = 0;
    let resumeAutoScrollAt = 0;
    let pointerDrag = null;
    let resizeTimer = null;

    function pauseAutoScroll(duration = 2400) {
      resumeAutoScrollAt = performance.now() + duration;
    }

    function chooseStartingParagraph(paragraphCount) {
      if (paragraphCount <= 1) {
        return 0;
      }

      const preferredParagraphs = [1, 2].filter(
        (index) => index < paragraphCount
      );

      if (
        preferredParagraphs.length > 0 &&
        Math.random() < 0.72
      ) {
        const randomIndex = Math.floor(
          Math.random() * preferredParagraphs.length
        );

        return preferredParagraphs[randomIndex];
      }

      return Math.floor(Math.random() * paragraphCount);
    }

    function limitExcerpt(text, maxLength = 420) {
      if (text.length <= maxLength) {
        return text;
      }

      const beginning = text.slice(0, maxLength);
      const lastSentenceEnd = Math.max(
        beginning.lastIndexOf(". "),
        beginning.lastIndexOf("! "),
        beginning.lastIndexOf("? ")
      );

      if (lastSentenceEnd > maxLength * 0.55) {
        return beginning.slice(0, lastSentenceEnd + 1).trim();
      }

      const lastSpace = beginning.lastIndexOf(" ");
      const cutAt = lastSpace > 0 ? lastSpace : maxLength;

      return `${beginning.slice(0, cutAt).trim()}…`;
    }

    function makeExcerpt(paragraphs, startIndex) {
      return limitExcerpt(paragraphs.slice(startIndex).join(" "));
    }

    function createTickerText(text) {
      const item = document.createElement("span");
      item.className = "ticker__text";
      item.textContent = text;
      return item;
    }

    function appendTickerCopy(group, text) {
      const separator = document.createElement("span");
      separator.className = "ticker__separator";
      separator.setAttribute("aria-hidden", "true");
      separator.textContent = "·";

      group.append(separator, createTickerText(text));
    }

    function createTickerGroup(text) {
      const group = document.createElement("div");
      group.className = "ticker__group";
      group.append(createTickerText(text));
      return group;
    }

    function renderTickerText(text) {
      currentTickerText = text;
      tickerCycleWidth = 0;
      tickerViewport.scrollLeft = 0;
      tickerTrack.replaceChildren();
      ticker.classList.add("ticker--static");

      const firstGroup = createTickerGroup(text);
      tickerTrack.append(firstGroup);

      if (reducedMotionQuery.matches) {
        return;
      }

      const targetWidth = Math.max(
        tickerViewport.clientWidth,
        MIN_TICKER_CYCLE_WIDTH
      ) + 80;

      let copyCount = 1;

      while (
        firstGroup.scrollWidth < targetWidth &&
        copyCount < 8
      ) {
        appendTickerCopy(firstGroup, text);
        copyCount += 1;
      }

      const duplicateGroup = firstGroup.cloneNode(true);
      duplicateGroup.setAttribute("aria-hidden", "true");
      tickerTrack.append(duplicateGroup);

      requestAnimationFrame(() => {
        tickerCycleWidth = firstGroup.getBoundingClientRect().width;

        if (tickerCycleWidth > 0) {
          tickerViewport.scrollLeft = 0;
          ticker.classList.remove("ticker--static");
        }
      });
    }

    function renderRandomStory() {
      const storyIndex = Math.floor(
        Math.random() * readingStories.length
      );

      const story = readingStories[storyIndex];
      const startIndex = chooseStartingParagraph(story.length);
      const excerpt = makeExcerpt(story, startIndex);

      renderTickerText(excerpt);
    }

    /*
      Используется для колёсика, клавиатуры и перетаскивания.
      Слева прокрутка останавливается на нуле — событие при этом
      уже отменено, поэтому Safari не должен запускать жест «назад».
    */
    function setTickerScrollPosition(nextPosition) {
      if (!Number.isFinite(nextPosition)) {
        return;
      }

      if (nextPosition < 0) {
        tickerViewport.scrollLeft = 0;
        return;
      }

      if (tickerCycleWidth > 0 && nextPosition >= tickerCycleWidth) {
        nextPosition %= tickerCycleWidth;
      }

      tickerViewport.scrollLeft = nextPosition;
    }

    function normalizeWheelDelta(delta, event) {
      if (event.deltaMode === 1) {
        return delta * 16;
      }

      if (event.deltaMode === 2) {
        return delta * tickerViewport.clientWidth;
      }

      return delta;
    }

    function handleTickerWheel(event) {
      const horizontalIntent =
        event.shiftKey ||
        Math.abs(event.deltaX) > Math.abs(event.deltaY);

      if (!horizontalIntent) {
        // Обычная вертикальная прокрутка страницы работает как прежде.
        return;
      }

      const rawDelta = event.shiftKey
        ? (event.deltaY || event.deltaX)
        : event.deltaX;

      if (!rawDelta) {
        return;
      }

      /*
        Перехватываем горизонтальный жест внутри строки.
        Это важно на левом краю, где Safari может воспринимать
        движение тачпада как переход на предыдущую страницу.
      */
      if (event.cancelable) {
        event.preventDefault();
      }

      event.stopPropagation();
      pauseAutoScroll();

      const delta = normalizeWheelDelta(rawDelta, event);

      setTickerScrollPosition(
        tickerViewport.scrollLeft + delta
      );
    }

    tickerViewport.addEventListener(
      "wheel",
      handleTickerWheel,
      { passive: false, capture: true }
    );

    tickerViewport.addEventListener("keydown", (event) => {
      const step = Math.max(
        80,
        Math.round(tickerViewport.clientWidth * 0.18)
      );

      if (event.key === "ArrowRight") {
        event.preventDefault();
        setTickerScrollPosition(tickerViewport.scrollLeft + step);
        pauseAutoScroll();
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        setTickerScrollPosition(tickerViewport.scrollLeft - step);
        pauseAutoScroll();
      } else if (event.key === "Home") {
        event.preventDefault();
        tickerViewport.scrollLeft = 0;
        pauseAutoScroll();
      } else if (event.key === "End") {
        event.preventDefault();
        setTickerScrollPosition(tickerCycleWidth || tickerViewport.scrollWidth);
        pauseAutoScroll();
      }
    });

    tickerViewport.addEventListener("pointerdown", (event) => {
      pauseAutoScroll();

      if (event.pointerType === "touch") {
        // На сенсорном экране остаётся доступна нативная прокрутка.
        return;
      }

      if (event.pointerType !== "mouse" || event.button !== 0) {
        return;
      }

      event.preventDefault();

      pointerDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startScrollLeft: tickerViewport.scrollLeft,
      };

      tickerViewport.classList.add("is-dragging");
      tickerViewport.setPointerCapture(event.pointerId);
    });

    tickerViewport.addEventListener("pointermove", (event) => {
      if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) {
        return;
      }

      event.preventDefault();

      const deltaX = event.clientX - pointerDrag.startX;

      setTickerScrollPosition(
        pointerDrag.startScrollLeft - deltaX
      );
    });

    function finishPointerDrag(event) {
      if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) {
        return;
      }

      pointerDrag = null;
      tickerViewport.classList.remove("is-dragging");
      pauseAutoScroll(2200);
    }

    tickerViewport.addEventListener("pointerup", finishPointerDrag);
    tickerViewport.addEventListener("pointercancel", finishPointerDrag);

    tickerViewport.addEventListener("focusin", () => {
      pauseAutoScroll();
    });

    tickerViewport.addEventListener("focusout", () => {
      pauseAutoScroll(1800);
    });

    function tickerAnimationFrame(timestamp) {
      if (!lastFrameTime) {
        lastFrameTime = timestamp;
      }

      const elapsedSeconds = Math.min(
        (timestamp - lastFrameTime) / 1000,
        0.05
      );

      lastFrameTime = timestamp;

      const pointerIsOverTicker = ticker.matches(":hover");
      const tickerHasKeyboardFocus = ticker.contains(
        document.activeElement
      );

      const shouldAutoScroll =
        !reducedMotionQuery.matches &&
        !ticker.classList.contains("ticker--static") &&
        document.visibilityState === "visible" &&
        !pointerIsOverTicker &&
        !tickerHasKeyboardFocus &&
        !pointerDrag &&
        timestamp >= resumeAutoScrollAt;

      if (shouldAutoScroll) {
        setTickerScrollPosition(
          tickerViewport.scrollLeft +
          AUTO_SCROLL_SPEED * elapsedSeconds
        );
      } else if (tickerViewport.scrollLeft < 0) {
        // На случай отрицательного overscroll в браузерах WebKit.
        tickerViewport.scrollLeft = 0;
      }

      requestAnimationFrame(tickerAnimationFrame);
    }

    function handleMotionPreferenceChange() {
      if (currentTickerText) {
        renderTickerText(currentTickerText);
      }
    }

    if (typeof reducedMotionQuery.addEventListener === "function") {
      reducedMotionQuery.addEventListener(
        "change",
        handleMotionPreferenceChange
      );
    } else {
      reducedMotionQuery.addListener(handleMotionPreferenceChange);
    }

    window.addEventListener(
      "resize",
      () => {
        if (!currentTickerText) {
          return;
        }

        window.clearTimeout(resizeTimer);

        resizeTimer = window.setTimeout(() => {
          renderTickerText(currentTickerText);
        }, 150);
      },
      { passive: true }
    );

    renderRandomStory();
    requestAnimationFrame(tickerAnimationFrame);
  </script>
</body>
</html>
