<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffffff" />

  <title>Fluent — английский без зубрёжки</title>

  <style>
    :root {
      color-scheme: light;

      --background: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-menu: rgba(29, 29, 31, 0.7);
      --apple-blue: #0071e3;

      --content-width: 1100px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text-primary);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .page-shell {
      display: flex;
      flex-direction: column;
      width: min(var(--content-width), calc(100% - 80px));
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding-block: 88px 42px;
    }

    .site-main {
      display: grid;
      grid-template-columns: minmax(240px, 0.92fr) minmax(0, 2.08fr);
      column-gap: clamp(56px, 7vw, 92px);
      align-items: start;
    }

    .brand-block {
      max-width: 320px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      line-height: 0;
      text-decoration: none;
    }

    .brand-logo {
      display: block;
      width: auto;
      height: 28px;
      max-width: 170px;
      object-fit: contain;
      object-position: left center;
    }

    .brand:focus-visible {
      outline: 2px solid var(--apple-blue);
      outline-offset: 6px;
      border-radius: 4px;
    }

    .tagline {
      max-width: 310px;
      margin: 21px 0 0;
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.015em;
    }

    .site-navigation {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: clamp(18px, 2.4vw, 30px);
    }

    .menu-column {
      min-width: 0;
    }

    .menu-heading {
      margin: 0 0 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.01em;
      text-align: left;
    }

    .menu-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-menu);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      cursor: default;
    }

    .menu-arrow {
      flex: none;
      font-size: 12px;
      line-height: 1;
    }

    .site-footer {
      width: 100%;
      margin-top: auto;
      padding-top: clamp(88px, 13vh, 140px);
    }

    .footer-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 240px;
      margin-inline: auto;
      object-fit: contain;
      object-position: center;
    }

    @media (max-width: 920px) {
      .page-shell {
        width: min(760px, calc(100% - 64px));
        padding-top: 62px;
      }

      .site-main {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 48px;
      }

      .brand-block {
        max-width: 420px;
      }
    }

    @media (max-width: 640px) {
      .page-shell {
        width: calc(100% - 40px);
        padding-block: 38px 26px;
      }

      .site-main {
        row-gap: 40px;
      }

      .site-navigation {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        row-gap: 32px;
        column-gap: 24px;
      }

      .tagline {
        font-size: 16px;
      }

      .site-footer {
        padding-top: 84px;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <main class="site-main" id="top">
      <section class="brand-block" aria-label="О Fluent">
        <a class="brand" href="#top">
          <!-- Файлы из public доступны по адресам /fluent.png и /footer.png -->
          <img class="brand-logo" src="/fluent.png" alt="Fluent" />
        </a>

        <h1 class="tagline">
          Английский проще, чем кажется.<br />
          Зачем зубрить, если можно практиковаться и становиться увереннее?
        </h1>
      </section>

      <nav
        class="site-navigation"
        id="site-navigation"
        aria-label="Основные разделы"
      ></nav>
    </main>

    <footer class="site-footer">
      <img class="footer-image" src="/footer.png" alt="" />
    </footer>
  </div>

  <script>
    // У каждого столбца — свой список пунктов.
    // Строки пока выводятся как некликабельные заглушки.
    const menuColumns = [
      {
        title: "Практика",
        items: ["Заглушка", "Ещё одна", "Заглушка", "Ещё одна"],
      },
      {
        title: "Материалы",
        items: ["Заглушка", "Ещё одна", "Заглушка"],
      },
      {
        title: "О проекте",
        items: ["Ещё одна", "Заглушка", "Ещё одна", "Заглушка"],
      },
      {
        title: "Social",
        items: [
          { label: "GitHub", external: true },
          { label: "Telegram", external: true },
        ],
      },
    ];

    const navigation = document.querySelector("#site-navigation");

    menuColumns.forEach((column) => {
      const group = document.createElement("section");
      group.className = "menu-column";

      const heading = document.createElement("h2");
      heading.className = "menu-heading";
      heading.textContent = column.title;

      const list = document.createElement("ul");
      list.className = "menu-list";

      column.items.forEach((item) => {
        const entry = typeof item === "string" ? { label: item } : item;

        const listItem = document.createElement("li");
        const label = document.createElement("span");
        label.className = "menu-item";

        if (entry.external) {
          const arrow = document.createElement("span");
          arrow.className = "menu-arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "↗";
          label.append(arrow);
        }

        const text = document.createElement("span");
        text.textContent = entry.label;
        label.append(text);

        listItem.append(label);
        list.append(listItem);
      });

      group.append(heading, list);
      navigation.append(group);
    });
  </script>
</body>
</html>
